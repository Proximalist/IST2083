# IST2083 — render doğrulama
#
# Bu iş akışı belge YAYIMLAMAZ. Tek işi, denetimden geçmiş belgelerin
# temiz bir Linux ortamında render edilebildiğini DOĞRULAMAKTIR.
#
# Neden: geliştirme macOS'ta yapılıyor, öğrenci ise Codespaces
# (Linux) kullanacak. İki ortam arasında sessizce kırılan hatalar
# yaşandı — Unicode normalize edilmiş dosya adları ve yalnızca bir
# klasörde bulunan görseller gibi. Bunlar macOS'ta görünmez, Linux'ta
# belgeyi bozar. Bu iş akışı onları push anında yakalar.
#
# Render edilen belgeler _quarto.yml içindeki render listesiyle
# sınırlıdır; henüz denetlenmemiş modüller kasten dışarıdadır.

name: Render doğrulama

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v5

      - name: Quarto kur
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.6.40"
          tinytex: true

      - name: R kur
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
          use-public-rspm: true

      - name: R paketlerini kur
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::knitr
            any::rmarkdown
            any::here
            any::ggplot2
            any::dplyr
            any::gapminder
            any::readxl
            any::writexl

      - name: Türkçe heceleme paketi (kurulamazsa render yine sürer)
        continue-on-error: true
        run: tlmgr install hyphen-turkish babel-turkish

      - name: Render
        env:
          QUARTO_PROFILE: ci
        run: quarto render

      - name: Üretilen belgeleri artefakt olarak sakla
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: render-ciktilari
          path: |
            **/*.pdf
            **/*.html
          retention-days: 7
          if-no-files-found: warn
